name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sqlite3
        run: bash scripts/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-aarch64
          path: bin/sqlite3
